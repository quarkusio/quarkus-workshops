quarkus.http.port=8067
quarkus.http.test-port=8068
# Use this to control what variant gets built
#workshop.variant.name=bt-gradle-os-all-ai-false-azure-false-cli-true-container-false-contract-testing-false-extension-false-locked-down-false-kubernetes-false-messaging-true-native-true-observability-false
# UNSAFE safe mode allows includes/reads from outside the base-dir. For trusted static site content,
# this is appropriate. The CI build patches the roq library to enable this until roq 2.1.10+ is released.
quarkus.asciidoc.safe-mode=UNSAFE
# Root Asciidoctor's base_dir (and therefore the safe-mode jail) at the site directory rather than
# at each page's own folder. Without this, asciidoctor-diagram can only read .puml files from, and
# only write .png files to, the directory of the page being rendered.
quarkus.asciidoc.base-dir=site
# imagesdir and assetsdir are URL prefixes in the generated HTML, not filesystem paths, and they
# are site-absolute. Relative values cannot work: the generated pages sit at four different
# depths (index.html, spine/, core-rest/rest/, variants/<name>/spine/), they all share this one
# attribute, and a value right for one depth is wrong for the others.
#
# docs.site-path is where the site will be served under its domain, empty when it is at the
# document root. build.yml passes -Ddocs.site-path, and the value differs between the published
# site and the surge PR previews, which sit at a shallower path; see SITE_PATH there.
# quarkus:dev and the test-phase tests serve at the root and leave it empty.
#
# It is deliberately not called site.path or workshop.site-path: site and workshop are both
# @ConfigMapping roots, and an unmapped key under a mapped root fails the build with SRCFG00050.
# Roq's own site.path-prefix is a different thing again -- it relocates the generated output into
# target/roq/<prefix>/, which the artifact assembly in build.yml does not expect.
#
# Serving a built site straight off the filesystem has no images or css either way; use
# quarkus:dev or a server rooted at docs.site-path.
quarkus.asciidoc.attributes.imagesdir=${docs.site-path:}/images
quarkus.asciidoc.attributes.assetsdir=${docs.site-path:}/assets
# Every filesystem path below is absolute. Asciidoctor resolves a relative imagesoutdir/outdir
# against the process working directory rather than base_dir, so relative values only happen too
# work when the JVM is started from this directory -- `mvn -f` from elsewhere silently breaks them.
quarkus.asciidoc.attributes.outdir=${user.dir}/public
# asciidoctor-diagram writes its rendered .png files here, while a page is being rendered. They go
# straight into the generated site rather than into public/, because Roq freezes the list of static
# files to copy at augmentation time (RoqGeneratorProcessor.initBuildSelection, from
# StaticResourcesBuildItem) and rendering happens long after that. A diagram written into public/ is
# therefore invisible to the build that produced it: the named ones are missing from every clean
# build, and the content-hashed diag-plantuml-md5-*.png ones are missing from every build where a
# diagram changed, because the hash makes the file name new. Writing into the output directory skips
# the static-file copy, and its contents, entirely.
#
# So this has to track quarkus.roq.generator.output-dir, which the surefire run overrides to
# roq-test; see the matching imagesoutdir in pom.xml. Dev mode generates no output directory at all
# and serves public/ live, so it keeps writing there.
quarkus.asciidoc.attributes.imagesoutdir=${user.dir}/target/roq/images
%dev.quarkus.asciidoc.attributes.imagesoutdir=${user.dir}/public/images
# asciidoctor-diagram only reads this one under a `diagram-`/`plantuml-` prefix, never as a plain
# `cachedir` attribute. Without it the .png.cache files land in public/ and get published.
quarkus.asciidoc.attributes.diagram-cachedir=${user.dir}/target/asciidoctor-diagram
quarkus.asciidoc.attributes.plantDir=${user.dir}/content/plantuml
# PlantUML's own `!include` (e.g. `!include style.puml`) is resolved by PlantUML itself,
# not by Asciidoctor, so it needs its own include path.
quarkus.asciidoc.attributes.plantuml-includedir=${user.dir}/content/plantuml
#To test theme changes locally, use
#quarkus.asciidoc.attributes.plantuml-theme-dir=${project.basedir}/src/docs/plantuml/themes/
quarkus.asciidoc.attributes.plantuml-theme-dir=https://quarkus.io/assets/plantuml/themes
# Source tree the docs snippet-include from, e.g. include::{projectdir}/rest-heroes/...[tag=...].
quarkus.asciidoc.attributes.projectdir=${user.dir}/../super-heroes
quarkus.asciidoc.attributes."showtitle"=false
quarkus.asciidoc.attributes.add-copy-button-to-config-props=true
quarkus.asciidoc.attributes.add-copy-button-to-env-var=true
quarkus.asciidoc.attributes.icons=font
quarkus.asciidoc.attributes.source-highlighter=highlightjs
quarkus.qute.content-types.yaml=text/yaml
quarkus.qute.content-types.txt=text/plain
quarkus.qute.alt-expr-syntax=true
#quarkus.qute.property-not-found-strategy=NOOP
quarkus.qute.strict-rendering=false
quarkus.web-bundler.bundling.external=/assets/*
site.url=https://quarkus.io/quarkus-workshops/super-heroes
quarkus.roq.generator.timeout=1200

