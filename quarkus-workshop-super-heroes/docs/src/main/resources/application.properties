# Documentation attributes whose values come from Maven.
#
# These used to be set as <systemProperties> on the quarkus-maven-plugin build and run executions,
# which meant they only ever reached the forked JVMs of the static site build. quarkus:dev never saw
# them, so under live reload every version rendered as a literal {quarkus-version}. Setting them
# here instead puts them on the classpath, so dev mode and the static build agree.
#
# Filtering is restricted to at-sign delimiters (see maven-resources-plugin in the pom) so that
# Quarkus config expressions written as ${...} survive to runtime untouched. That matters here: the
# github urls expand to strings that themselves contain ${env.GITHUB_REPOSITORY:[repo]}, and it is
# Quarkus, not Maven, that resolves those when the application starts. For the same reason, do not
# write a bare at-sign-delimited token in these comments: Maven will substitute it.
#
# Attributes built from ${user.dir} stay in config/application.properties, which is not filtered.
#
# NOTE! Any version listed here should have an entry in the dependencies, so that dependabot keeps
# the docs in sync with the implementation.

quarkus.asciidoc.attributes.github-raw=@github.raw@
quarkus.asciidoc.attributes.github-url=@github.url@
quarkus.asciidoc.attributes.github-repo=@github.repo@
quarkus.asciidoc.attributes.github-issue=@github.issue@
quarkus.asciidoc.attributes.base-url=@base.url@
quarkus.asciidoc.attributes.give-solution=true
quarkus.asciidoc.attributes.jdk-version=@maven.compiler.release@
quarkus.asciidoc.attributes.graalvm-version=21
quarkus.asciidoc.attributes.maven-version=3.9.x
quarkus.asciidoc.attributes.quarkus-version=@quarkus.platform.version@
quarkus.asciidoc.attributes.compiler-plugin-version=@compiler-plugin.version@
quarkus.asciidoc.attributes.surefire-plugin-version=@surefire-plugin.version@
quarkus.asciidoc.attributes.quarkus-pact-version=@quarkus.pact.version@
quarkus.asciidoc.attributes.quarkus-langchain4j-version=@quarkus-langchain4j.version@
