quarkus.http.port=8067
quarkus.http.test-port=8068
# Root Asciidoctor's base_dir (and therefore the safe-mode jail) at the site directory rather than
# at each page's own folder. Without this, asciidoctor-diagram can only read .puml files from, and
# only write .png files to, the directory of the page being rendered.
quarkus.asciidoc.base-dir=site
# imagesdir is a URL prefix in the generated HTML, so it stays site-absolute rather than filesystem.
quarkus.asciidoc.attributes.imagesdir=/images
quarkus.asciidoc.attributes.assetsdir=/assets
# Every filesystem path below is absolute. Asciidoctor resolves a relative imagesoutdir/outdir
# against the process working directory rather than base_dir, so relative values only happen to
# work when the JVM is started from this directory -- `mvn -f` from elsewhere silently breaks them.
quarkus.asciidoc.attributes.outdir=${user.dir}/public
quarkus.asciidoc.attributes.imagesoutdir=${user.dir}/public/images
# asciidoctor-diagram only reads this one under a `diagram-`/`plantuml-` prefix, never as a plain
# `cachedir` attribute. Without it the .png.cache files land in public/ and get published.
quarkus.asciidoc.attributes.diagram-cachedir=${user.dir}/target/asciidoctor-diagram
quarkus.asciidoc.attributes.plantDir=${user.dir}/content/asciidoc/plantuml
# PlantUML's own `!include` (e.g. `!include style.puml`) is resolved by PlantUML itself,
# not by Asciidoctor, so it needs its own include path.
quarkus.asciidoc.attributes.plantuml-includedir=${user.dir}/content/asciidoc/plantuml
quarkus.asciidoc.attributes.plantuml-theme-dir=https://quarkus.io/assets/plantuml/themes
# Source tree the docs snippet-include from, e.g. include::{projectdir}/rest-heroes/...[tag=...].
quarkus.asciidoc.attributes.projectdir=${user.dir}/super-heroes
quarkus.asciidoc.attributes."showtitle"=false
quarkus.asciidoc.attributes.add-copy-button-to-config-props=true
quarkus.asciidoc.attributes.add-copy-button-to-env-var=true
quarkus.asciidoc.attributes.icons=font
quarkus.asciidoc.attributes.source-highlighter=highlightjs
quarkus.qute.content-types.yaml=text/yaml
quarkus.qute.content-types.txt=text/plain
quarkus.qute.alt-expr-syntax=true
#quarkus.qute.property-not-found-strategy=NOOP
quarkus.qute.strict-rendering=false
quarkus.web-bundler.bundling.external=/assets/*
# Trailing slash works around https://github.com/quarkiverse/quarkus-web-bundler/issues/473
site.collections.versions.link=/version/:dir[1]/:name/
site.date-format=yyyy-MM-dd['T'HH:mm:ss][X]
%dev.site.draft=true
%dev.site.future=true
%test.site.draft=true
%test.site.future=true
site.url=https://quarkus.io/quarkus-workshops/super-heroes
site.ignored-files=**/_**,_**,**/!(.well\\\\-known)**.**
quarkus.roq.tagging.lowercase=true
quarkus.roq.generator.timeout=600
